# A mano (botón "Run workflow"): mira qué jar de Warband Craft tiene el servidor y las líneas del log que nos importan.
# El repositorio es público: no se muestran IPs ni el log entero.
name: Diagnóstico del servidor

on:
  workflow_dispatch:

permissions:
  contents: read

env:
  SFTP_HOST: gs-04.baires.host
  SFTP_PORT: "2022"
  SFTP_USER: jj87kdav.d607d01a

jobs:
  diagnostico:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Bajar el jar de la release "ultima"
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p release
          gh release download ultima -R "$GITHUB_REPOSITORY" -p 'warbandcraft-*.jar' -D release
          sha1sum release/*.jar

      - name: Traer el jar y el log del servidor
        env:
          LFTP_PASSWORD: ${{ secrets.SFTP_PASSWORD }}
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq lftp > /dev/null
          mkdir -p srv
          lftp -c "set sftp:auto-confirm yes; set net:max-retries 3; set net:timeout 30;
                   open --env-password -u $SFTP_USER -p $SFTP_PORT sftp://$SFTP_HOST;
                   cls -l --time-style=%Y-%m-%d_%H:%M /mods/warbandcraft* ;
                   cls -l --time-style=%Y-%m-%d_%H:%M /logs/latest.log ;
                   get /mods/warbandcraft-1.0.0.jar -o srv/warbandcraft-1.0.0.jar ;
                   get /logs/latest.log -o srv/latest.log;
                   get /server.properties -o srv/server.properties" || true
          LEVEL=$(grep -E '^level-name=' srv/server.properties | cut -d= -f2- | tr -d '')
          echo "mundo: ${LEVEL:-world}"
          lftp -c "set sftp:auto-confirm yes; set net:max-retries 3; set net:timeout 30;
                   open --env-password -u $SFTP_USER -p $SFTP_PORT sftp://$SFTP_HOST;
                   get /${LEVEL:-world}/data/scoreboard.dat -o srv/scoreboard.dat" || true

      - name: Facciones (equipos del marcador, sin los soldados)
        shell: python
        run: |
          import gzip, io, re, struct, pathlib
          p = pathlib.Path("srv/scoreboard.dat")
          if not p.exists():
              print("sin scoreboard.dat"); raise SystemExit
          b = io.BytesIO(gzip.decompress(p.read_bytes()))
          def rd(n): return b.read(n)
          def s(): n = struct.unpack(">H", rd(2))[0]; return rd(n).decode("utf-8", "replace")
          def payload(t):
              if t == 1: return rd(1)[0]
              if t == 2: return struct.unpack(">h", rd(2))[0]
              if t == 3: return struct.unpack(">i", rd(4))[0]
              if t == 4: return struct.unpack(">q", rd(8))[0]
              if t == 5: return struct.unpack(">f", rd(4))[0]
              if t == 6: return struct.unpack(">d", rd(8))[0]
              if t == 7: n = struct.unpack(">i", rd(4))[0]; return rd(n)
              if t == 8: return s()
              if t == 9:
                  et = rd(1)[0]; n = struct.unpack(">i", rd(4))[0]; return [payload(et) for _ in range(n)]
              if t == 10:
                  d = {}
                  while True:
                      tt = rd(1)[0]
                      if tt == 0: return d
                      k = s(); d[k] = payload(tt)
              if t == 11: n = struct.unpack(">i", rd(4))[0]; return [struct.unpack(">i", rd(4))[0] for _ in range(n)]
              if t == 12: n = struct.unpack(">i", rd(4))[0]; return [struct.unpack(">q", rd(8))[0] for _ in range(n)]
              raise ValueError(t)
          rd(1); s(); root = payload(10)
          uuid = re.compile(r"^[0-9a-f]{8}-[0-9a-f]{4}-")
          for t in root.get("data", {}).get("Teams", []):
              players = t.get("Players", [])
              people = [x for x in players if not uuid.match(x)]
              print(f"equipo {t.get('Name')!r}: jugadores {people}, soldados {len(players) - len(people)}")

      - name: Comparar y mostrar
        run: |
          echo "== jar del servidor vs release"
          sha1sum srv/*.jar release/*.jar || true
          echo "== ¿tiene lo nuevo? (clases)"
          unzip -l srv/warbandcraft-1.0.0.jar | grep -E "faction/Allies|LoginPositionEvents" || echo "NO tiene las clases nuevas"
          echo "== log (sin IPs)"
          sed -E 's/[0-9]{1,3}(\.[0-9]{1,3}){3}(:[0-9]+)?/<ip>/g' srv/latest.log \
            | grep -a -E "Done \(|Starting minecraft server|warbandcraft|WarbandCraft|Login:|ServerOfflineAuth|citprobe|joined the game|left the game|logged in|Campamento|Exception|ERROR" \
            | grep -a -v -i "password|contrase|token" | head -200
