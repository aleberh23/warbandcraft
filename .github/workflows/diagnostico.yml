# A mano (botón "Run workflow"): mira qué jar de Warband Craft tiene el servidor y las líneas del log que nos importan.
# El repositorio es público: no se muestran IPs ni el log entero.
name: Diagnóstico del servidor

on:
  workflow_dispatch:

permissions:
  contents: read

env:
  SFTP_HOST: gs-04.baires.host
  SFTP_PORT: "2022"
  SFTP_USER: jj87kdav.d607d01a

jobs:
  diagnostico:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Bajar el jar de la release "ultima"
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p release
          gh release download ultima -R "$GITHUB_REPOSITORY" -p 'warbandcraft-*.jar' -D release
          sha1sum release/*.jar

      - name: Traer el jar y el log del servidor
        env:
          LFTP_PASSWORD: ${{ secrets.SFTP_PASSWORD }}
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq lftp > /dev/null
          mkdir -p srv
          lftp -c "set sftp:auto-confirm yes; set net:max-retries 3; set net:timeout 30;
                   open --env-password -u $SFTP_USER -p $SFTP_PORT sftp://$SFTP_HOST;
                   cls -l --time-style=%Y-%m-%d_%H:%M /mods/warbandcraft* ;
                   cls -l --time-style=%Y-%m-%d_%H:%M /logs/latest.log ;
                   get /mods/warbandcraft-1.0.0.jar -o srv/warbandcraft-1.0.0.jar ;
                   get /logs/latest.log -o srv/latest.log" || true

      - name: Comparar y mostrar
        run: |
          echo "== jar del servidor vs release"
          sha1sum srv/*.jar release/*.jar || true
          echo "== ¿tiene lo nuevo? (clases)"
          unzip -l srv/warbandcraft-1.0.0.jar | grep -E "faction/Allies|LoginPositionEvents" || echo "NO tiene las clases nuevas"
          echo "== log (sin IPs)"
          sed -E 's/[0-9]{1,3}(\.[0-9]{1,3}){3}(:[0-9]+)?/<ip>/g' srv/latest.log \
            | grep -a -E "Done \(|Starting minecraft server|warbandcraft|WarbandCraft|Login:|ServerOfflineAuth|citprobe|joined the game|left the game|logged in|Campamento|Exception|ERROR" \
            | grep -a -v -i "password|contrase|token" | head -200
