name: Importar código

# Se usó una sola vez para subir el código sin terminal: se sube warbandcraft.bundle (git bundle) por la web,
# esto lo desempaqueta en main, borra el bundle y lanza la compilación. Se puede borrar sin problema.
on:
  push:
    branches: [main]
    paths: [warbandcraft.bundle]

permissions:
  contents: write
  actions: write

jobs:
  importar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Desempaquetar el bundle
        run: |
          git config user.name "Ale"
          git config user.email "aledeberhardt@gmail.com"
          git bundle verify warbandcraft.bundle
          git fetch ./warbandcraft.bundle main:importado
          git checkout importado -- .
          git rm -q --cached warbandcraft.bundle && rm warbandcraft.bundle
          git commit -q -F <(git log -1 --pretty=%B importado)
          git push origin HEAD:main
      - name: Compilar
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run build.yml --ref main
