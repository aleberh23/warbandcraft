name: Compilar

# Cada push a main compila el mod y deja en la release pública "ultima": el .jar, WarbandCraft-juego.zip (instalador;
# también lo baja el acceso directo "Jugar Warband Craft") y WarbandCraft-Prism.zip (instancia de Prism que se actualiza sola).
# Cuando termina bien, arranca "Subir al servidor" (deploy.yml).
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: compilar
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4

      # build.gradle baja Recruits, Workers y los mods del paquete a libs/ (de Modrinth); se guardan entre corridas
      - uses: actions/cache@v4
        with:
          path: libs
          key: libs-${{ hashFiles('gradle.properties') }}

      - name: Compilar
        run: |
          sed -i 's/\r$//' gradlew
          chmod +x gradlew
          ./gradlew build --no-daemon

      - name: Publicar en la release "ultima"
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          ls -la build/libs
          JAR=$(ls build/libs/warbandcraft-*.jar | grep -v -e sources -e slim | head -n1)
          python3 tools/make_pack.py
          EXTRA=""
          for kind in juego prism; do
            f=$(ls dist/WarbandCraft-*-$kind.zip 2>/dev/null | head -n1)
            if [ -n "$f" ]; then
              [ "$kind" = prism ] && dest=WarbandCraft-Prism.zip || dest=WarbandCraft-juego.zip
              cp "$f" "$dest"; EXTRA="$EXTRA $dest"
            fi
          done
          gh release delete ultima --yes --cleanup-tag || true
          gh release create ultima "$JAR" $EXTRA --prerelease --target "$GITHUB_SHA" \
            --title "Última compilación" \
            --notes "Compilado automáticamente desde ${GITHUB_SHA::7}: $(git log -1 --pretty=%s)"

      - uses: actions/upload-artifact@v4
        with:
          name: warbandcraft-jar
          path: build/libs/*.jar
